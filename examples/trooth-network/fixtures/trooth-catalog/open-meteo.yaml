id: "open-meteo"
name: "Open-Meteo Weather API"
description: "Global open weather forecast API combining national numerical weather prediction models including NOAA GFS/HRRR, ECMWF, DWD ICON, and MeteoFrance."
endpoints:
  - name: "current_weather"
    url: "https://api.open-meteo.com/v1/forecast"
    method: "GET"
    params:
      latitude: 40.64
      longitude: -73.78
      current: "temperature_2m,relative_humidity_2m,wind_speed_10m"
      hourly: "temperature_2m"
auth:
  type: "none"
  notes: "Free for non-commercial and open use without API key up to 10,000 daily API calls."
license:
  spdx: "CC-BY-4.0"
  name: "Creative Commons Attribution 4.0 International"
  url: "https://open-meteo.com/en/license"
  redistribution_allowed: true
  attribution_required: true
  attribution_text: "Weather data by Open-Meteo.com"
  notes: "Free open-source weather API. Attribution with a link to open-meteo.com is required."
refresh_cadence: "hourly"
declared_lineage:
  role: "derivative"
  upstream_sources:
    - "nws"
    - "noaa-gfs"
    - "ecmwf"
    - "dwd"
  notes: "Interpolates and derives values from NOAA NWS and other national weather models. Demonstrates measurable publication lag vs primary NWS."
freshness_field: "current.time"
fields:
  - name: "current.time"
    type: "string"
    description: "ISO 8601 string of current model output timestep."
  - name: "current.temperature_2m"
    type: "number"
    description: "Air temperature at 2 meters above ground in degrees Celsius."
  - name: "current.relative_humidity_2m"
    type: "number"
    description: "Relative humidity at 2 meters above ground as a percentage."
  - name: "current.wind_speed_10m"
    type: "number"
    description: "Wind speed at 10 meters above ground in km/h."
quirks:
  - "Values are model-interpolated rather than direct physical station sensor readings."
  - "Model update cycles occur every 1 to 3 hours depending on upstream model run schedule."
cost:
  model: "freemium"
  rate_limit: "10,000 daily API calls for non-commercial use; max 5,000 calls/hour."
  pricing_url: "https://open-meteo.com/en/pricing"
