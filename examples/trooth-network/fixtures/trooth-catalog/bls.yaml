id: "bls"
name: "Bureau of Labor Statistics Public Data API"
description: "Primary United States labor market and macroeconomic indicators including the Consumer Price Index (CPI) and Unemployment Rate."
endpoints:
  - name: "cpi_u_series"
    url: "https://api.bls.gov/publicAPI/v1/timeseries/data/CUUR0000SA0"
    method: "GET"
auth:
  type: "none"
  notes: "v1 API is public without registration (up to 25 queries/day, 10 years per query). v2 API supports free registered registration key for 500 queries/day."
license:
  spdx: "public-domain"
  name: "U.S. Government Work (BLS Linking and Copyright Policy)"
  url: "https://www.bls.gov/bls/linksite.htm"
  redistribution_allowed: true
  attribution_required: false
  attribution_text: "U.S. Bureau of Labor Statistics"
  notes: "Information generated by the BLS is in the public domain and may be reproduced without permission."
refresh_cadence: "monthly"
declared_lineage:
  role: "primary"
  notes: "Primary originating agency for official United States employment, compensation, and consumer price statistics."
freshness_field: "Results.series[0].data[0].year"
fields:
  - name: "Results.series[].data[].year"
    type: "string"
    description: "Reference calendar year of the economic observation."
  - name: "Results.series[].data[].period"
    type: "string"
    description: "Period code (e.g. M01 for January, M12 for December)."
  - name: "Results.series[].data[].periodName"
    type: "string"
    description: "Full name of reference month or quarter."
  - name: "Results.series[].data[].value"
    type: "string"
    description: "Reported index value or rate as numeric string."
quirks:
  - "Values are encoded as strings rather than JSON numbers."
  - "Historical figures are subject to annual benchmark and seasonal adjustment revisions."
  - "Strict daily query quotas on anonymous v1 tier."
cost:
  model: "free"
  rate_limit: "25 queries per day for unregistered v1 API; 500 queries per day for registered v2."
  pricing_url: "https://www.bls.gov/developers/api_faqs.htm"
