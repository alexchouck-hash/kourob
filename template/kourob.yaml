# Node manifest. Brief reference: section 8.
# `kourob init` fills identity and scope; everything else starts at these defaults.
kourob: "0.1"

identity:
  # did:key over the ed25519 public key in .kourob/keys/ (gitignored, never committed).
  did: "{{ node_did }}"
  name: "{{ node_name }}"
  set: "{{ set_name }}"        # the operator's set; shares a registry and a trust root

scope:
  # What this node answers. Rules first, T1 classifier second (brief section 2).
  summary: "{{ scope_summary }}"
  schemas: []                  # ODCS contract ids this node owns, e.g. [shot.v1]
  entities: []                 # entity kinds this node is authoritative for
  capabilities: []             # tool names this node offers
  max_hops: 4                  # loop prevention (brief section 7)

ports:
  mcp: { enabled: true }
  a2a: { enabled: false, agent_card: "/.well-known/agent.json" }
  rest: { enabled: false, host: "127.0.0.1", port: 8080 }
  events: { enabled: false, sse: true, webhooks: [] }
  files: { enabled: true, inbox: "data/bronze/inbox" }
  git: { enabled: false }

tiers:
  # The cascade tries the cheapest tier that clears its confidence bar.
  t0: { enabled: true, confidence_bar: 0.90 }
  t1: { enabled: false, confidence_bar: 0.85, model: null }  # requires a gold set
  t2: { enabled: false, confidence_bar: 0.80, model: null }
  t3: { enabled: true, confidence_bar: 0.00, model: null }   # frontier, via runner/
  t4: { enabled: false }                                     # human queue, review_required only

pricing:
  # price = base_cost(tier) * (1 + demand_factor) * quality_multiplier  (brief 5.1)
  base_cost: { T0: 0.0001, T1: 0.0005, T2: 0.002, T3: 0.02, T4: 1.0 }
  capacity_window: 1000        # requests per window before demand_factor rises
  window: "1h"
  max_surge: 3.0
  quality_multiplier: 1.0
  free_allowance: 100          # requests per caller per window

cell:
  # The size ceiling (KNP-8 section 2.3). Exceeding it does not raise it: the cell sheds
  # or divides. A PR that pushes any of these over budget fails CI.
  max_context_tokens: 15000    # a task pack must fit. The binding constraint
  max_source_files: 40
  max_source_lines: 4000
  max_schemas: 3
  max_tiers: 4
  max_hot_storage_mb: 500      # cold-stored partitions are exempt
  max_tools: 8
  on_exceed: propose_division

autonomy:
  # What this cell may change about itself without asking (KNP-7 section 2).
  # Set by the operator's tooling from the ledger. A node cannot promote itself.
  level: A0                    # A0 observe, A1 tune, A2 promote, A3 restructure, A4 fund
  graduation_window: 4         # consecutive clean evolve cycles to earn the next level
  settle_floor: 0.2
  rollback_window: 30d
  evolution_budget: 1.0        # credits per cycle
  bootstrap_grant: 10.0        # operator's stake in a node with no revenue yet
  bootstrap_window: 90d

prune:
  # Hebbian route dynamics and garbage collection (KNP-9 sections 3 and 4).
  # Nothing here can collect an event, a receipt, or an outcome.
  prune_floor: 0.05
  prune_window: 30d
  rule_window: 60d
  page_window: 90d
  shed_window: 90d
  decay_per_window: 0.9
  hebbian_alpha: 0.3
  hebbian_beta: 0.5

split:
  split_threshold: 0.5         # demand_factor above which a split is considered
  split_window: "14d"          # hysteresis, so noise does not cause thrash
  merge_window: "30d"
  min_cluster_share: 0.2
  auto_approve: false          # splits open a PR; a human accepts

bridge:
  enabled: true
  bridge_limit: 3              # per (caller, scope), then refer only (brief 3.2)

loops:
  ingest:  { trigger: "on_push" }
  compile: { trigger: "on_event", budget_credits: 1.0 }
  lint:    { trigger: "nightly", budget_credits: 1.0 }
  evolve:  { trigger: "weekly", budget_credits: 10.0 }
  prune:   { trigger: "weekly", budget_credits: 1.0 }
  reflect: { trigger: "weekly", budget_credits: 2.0 }

retention:
  bronze: "90d"
  quarantine: "180d"
  derived: "rebuildable"       # deletable at any time
  requests: "365d"
  receipts: "forever"          # the ledger is the provenance record

store:
  backend: "parquet_duckdb"    # ADR-0001. Single writer in v1.
  partition_by: "month"
