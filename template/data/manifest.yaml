# Data zones. Brief reference: section 8 and docs/GLOSSARY.md.
zones:
  bronze:
    description: Raw source material as received.
    writer: ingest loop
    versioning: dvc
    retention: 90d
  silver:
    description: Gated, validated, deduped, typed events.
    writer: gate.py            # the ONLY writer. CI enforces this.
    versioning: git
    retention: forever
  gold:
    description: Human-verified labels and evaluation sets.
    writer: gate.py
    reachable_from_training: via evals/ only
    versioning: git
    retention: forever
  quarantine:
    description: Pushes that failed the gate, with the reason. Read by evolve.
    writer: gate.py
    versioning: git
    retention: 180d
  derived:
    description: Anything rebuildable from silver. Deletable at any time.
    writer: compile loop
    versioning: none
    retention: rebuildable
